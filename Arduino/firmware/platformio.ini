; PlatformIO - Ponte USB->CAN (Arduino Nano + MCP2515)
;
; Compilar/gravar:
;     pio run -t upload                 (bootloader OLD - Nano clone / CH340)
;     pio run -e nano_new -t upload     (bootloader NEW - Nano oficial novo)
;
; Escolher a porta (se nao detectar sozinho):
;     pio run -t upload --upload-port COM5
;
; Monitor serial:
;     pio device monitor

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
lib_deps =
    coryjfowler/mcp_can @ ^1.5.1

; --- Nano com bootloader OLD (clones / chip CH340) - padrao ---
[env:nano_old]
board = nanoatmega328

; --- Nano com bootloader NEW (oficial mais novo) ---
[env:nano_new]
board = nanoatmega328new

[platformio]
; Esta placa (CH340) usa o bootloader NOVO (115200). Use nano_old se trocar
; para um Nano com bootloader antigo.
default_envs = nano_new
