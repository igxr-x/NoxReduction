; PlatformIO - Ponte USB->CAN (2x MCP2515)
;
; Compilar/gravar:
;     pio run -t upload                    (usa o default_envs = esp32c3)
;     pio run -e esp32c3 -t upload         (ESP32-C3-MINI-1, USB nativo)
;     pio run -e nano_new -t upload        (Arduino Nano - bootloader novo)
;     pio run -e nano_old -t upload        (Arduino Nano - bootloader antigo)
;
; Escolher a porta (se nao detectar sozinho):
;     pio run -e esp32c3 -t upload --upload-port COM7
;
; Monitor serial:
;     pio device monitor -e esp32c3
;
; Se o C3 nao entrar em modo de gravacao sozinho: segure BOOT (GPIO9),
; toque RESET, solte BOOT, e rode o upload de novo.

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    coryjfowler/mcp_can @ ^1.5.1

; ===================== LilyGO T-2CAN (ESP32-S3, WiFi) =====================
; Bridge SEM FIO: cria um Wi-Fi proprio ("BridgeCAN") e serve uma pagina web
; de configuracao/telemetria. Um lado do barramento e' o MCP2515 (SPI), o
; outro e' o CAN nativo (TWAI) do ESP32-S3. Grava via USB-C (USB nativo).
;   pio run -e t2can -t upload
;   pio device monitor -e t2can        (mostra o IP do Wi-Fi ao ligar)
[env:t2can]
platform = espressif32
board = esp32-s3-devkitc-1
build_src_filter = -<*> +<t2can_main.cpp>   ; so compila o firmware da T-2CAN
build_flags =
    -DARDUINO_USB_MODE=1          ; USB nativo do S3
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial de debug pela propria porta USB-C
lib_deps =
    coryjfowler/mcp_can @ ^1.5.1
    links2004/WebSockets @ ^2.4.1

; ===================== ESP32-C3-MINI-1 (RISC-V, 4MB) =====================
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_src_filter = +<*> -<t2can_main.cpp>
build_flags =
    -DARDUINO_USB_MODE=1          ; usa o controlador USB nativo do C3
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial vai pela porta USB (COM) direto

; --- Nano com bootloader OLD (clones / chip CH340) ---
[env:nano_old]
platform = atmelavr
board = nanoatmega328
build_src_filter = +<*> -<t2can_main.cpp>

; --- Nano com bootloader NEW (oficial mais novo) ---
[env:nano_new]
platform = atmelavr
board = nanoatmega328new
build_src_filter = +<*> -<t2can_main.cpp>

[platformio]
default_envs = t2can
